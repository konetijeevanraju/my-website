<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pushpa Universe - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    .background-section {
      background-image: url('1234.jpg');
      background-size: cover;
      background-position: center 20%;
      background-repeat: no-repeat;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.5);
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    .navbar {
      background: rgba(0, 0, 0, 0.85);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 1rem 2rem;
    }

    .nav-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      z-index: 1001;
    }

    .nav-title img {
      height: 40px;
      width: 40px;
      margin-right: 10px;
    }

    .nav-title h1 {
      font-size: 1.8rem;
      color: #FFD700;
      white-space: nowrap;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 30px;
      height: 25px;
      justify-content: space-between;
    }

    .nav-toggle span {
      display: block;
      height: 4px;
      background-color: #FFD700;
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
      list-style: none;
    }

    .nav-links li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-links li a:hover {
      color: #FFD700;
    }

    .home-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      padding: 20px;
    }

    .home-banner h2 {
      font-size: 3rem;
      color: #FFD700;
      text-shadow: 2px 2px 10px #000;
      margin-bottom: 10px;
    }

    .home-banner p {
      font-size: 1.2rem;
      color: #fff;
      text-shadow: 1px 1px 5px #000;
    }

    /* Responsive for Mobile */
    @media (max-width: 768px) {
      .nav-toggle {
        display: flex;
        margin-left: 15px;
      }

      .nav-links {
        position: absolute;
        top: 70px;
        right: 0;
        background: rgba(0, 0, 0, 0.95);
        flex-direction: column;
        max-height: 0;
        overflow: hidden;
        width: 100%;
        padding: 0;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
        transition: max-height 0.4s ease, padding 0.3s ease;
      }

      .nav-links.active {
        max-height: 400px;
        padding: 1rem 2rem;
      }

      .nav-links li {
        margin: 10px 0;
        text-align: right;
      }

      .home-banner h2 {
        font-size: 2rem;
      }

      .home-banner p {
        font-size: 1rem;
      }

      .nav-title h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <!-- Centered title -->
    <div class="nav-title">
      <img src="Screenshot 2025-06-12 094740.png" alt="Pushpa Icon" />
      <h1>Pushpa Universe</h1>
    </div>

    <!-- Navigation & Toggle -->
    <div class="nav-right">
      <div class="nav-toggle" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" onclick="closeMenu()">Home</a></li>
        <li><a href="video.html" onclick="closeMenu()">Videos</a></li>
        <li><a href="photo.html" onclick="closeMenu()">Photos</a></li>
        <li><a href="awards.html" onclick="closeMenu()">Awards</a></li>
        <li><a href="cast.html" onclick="closeMenu()">Cast</a></li>
        <li><a href="collection.html" onclick="closeMenu()">Achievements</a></li>
      </ul>
    </div>
  </nav>

  <!-- Background Banner -->
  <section class="background-section">
    <div class="overlay"></div>
    <div class="home-banner">
      <h2>Welcome to Pushpa Universe</h2>
      <p>Get ready to explore the power, passion & legacy of Pushpa Raj 💥</p>
      <p>Pushpa ante flower anukuntiva? Fireuu! 🔥</p>
    </div>
  </section>

  <script>
    function toggleMenu() {
      document.getElementById('nav-links').classList.toggle('active');
    }

    function closeMenu() {
      document.getElementById('nav-links').classList.remove('active');
    }
  </script>

</body>
</html>
